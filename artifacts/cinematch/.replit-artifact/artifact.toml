kind = "web"
previewPath = "/"
title = "CineMatch - Film Izlovchi"
version = "1.0.0"
id = "artifacts/cinematch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22168
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cinematch run dev"

[services.env]
PORT = "22168"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cinematch", "run", "build"]
publicDir = "artifacts/cinematch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
